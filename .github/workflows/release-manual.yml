# Option B: Manual release pipeline (go build + gh release)
# Kept as workflow_dispatch for comparison — Option A (GoReleaser) is the active v* tag pipeline.
# To use this instead, swap triggers: move the v* tag trigger here and change release-goreleaser.yml to workflow_dispatch.
name: Release (Manual)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"

      - name: Import GPG key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
          echo "${{ secrets.GPG_PASSPHRASE }}" | gpg --batch --passphrase-fd 0 --pinentry-mode loopback --sign /dev/null 2>/dev/null || true

      - name: Build all platforms
        run: make build-all VERSION=${{ inputs.tag }}

      - name: Generate checksums
        run: make checksums

      - name: Sign checksums
        run: |
          GPG_FINGERPRINT=$(gpg --list-keys --keyid-format long | grep -A1 'pub' | tail -1 | awk '{print $1}')
          VERSION="${{ inputs.tag }}"
          VERSION="${VERSION#v}"
          gpg --batch --local-user "$GPG_FINGERPRINT" --detach-sign "dist/terraform-provider-devin_${VERSION}_SHA256SUMS"

      - name: Generate Terraform Registry manifest
        run: make manifest

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.tag }}"
          VERSION="${TAG#v}"
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            dist/terraform-provider-devin_${VERSION}_*.zip \
            dist/terraform-provider-devin_${VERSION}_SHA256SUMS \
            dist/terraform-provider-devin_${VERSION}_SHA256SUMS.sig \
            dist/terraform-registry-manifest.json
